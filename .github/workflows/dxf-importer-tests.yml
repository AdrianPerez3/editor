name: dxf-importer tests

on:
  pull_request:
    paths:
      - 'packages/dxf-importer/**'
      - '.github/workflows/dxf-importer-tests.yml'
      - 'package.json'
      - 'bun.lock'
      - 'turbo.json'
  push:
    branches:
      - main
    paths:
      - 'packages/dxf-importer/**'
      - '.github/workflows/dxf-importer-tests.yml'

jobs:
  test:
    name: vitest + typecheck + lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check
        working-directory: packages/dxf-importer
        run: bun run check-types

      - name: Lint
        run: bunx biome lint packages/dxf-importer

      - name: Run tests
        working-directory: packages/dxf-importer
        run: bun run test

      - name: Build
        working-directory: packages/dxf-importer
        run: bun run build
